<script>
    function varTest(){
        if (true)
    {
        var a=10;//scope is not restricted to if block
        console.log('inside block',a);//10
    }

    console.log('inside function',a);// scope is function
}
varTest();
function letTest(){
        if(true)
    {
        let a=10;//a is block scope
        console.log('inside block',a);//10
    }

    console.log('inside function',a);// a is not visible 
}
letTest();
</script>
